name: On Push, Build and Terraform Apply

on:
  push:
    branches:
      - develop  # Trigger this workflow on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests to main branch
  workflow_dispatch:  # Enables manual trigger from the UI

jobs:
  run-tests:
    name: (E2E) Run Dotnet Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.S3_PARIAH_NEXUS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Download SQL and config from S3
        run: |
          aws s3 cp s3://${{ secrets.TARGET_S3_BUCKET_NAME }}/projects/cyberpunk/pariah-nexus-api/initialization_data/initialize_database.sql ./Database/initialize_database.sql

      - name: Start Docker Compose (run tests)
        run: |
          docker compose -f "docker-compose.yml" up --build --abort-on-container-exit
      
      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f "docker-compose.yml" down

  build-deploy:
    name: Build and Deploy Code
    runs-on: ubuntu-latest
    needs: run-tests
    if: success()
    permissions:
      id-token: write  # Required to exchange the GitHub token for AWS credentials
      contents: read   # Standard permission to read the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.S3_PARIAH_NEXUS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build API Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pariah-nexus-api:latest -f ./Dockerfile .

      - name: Download SQL and config from S3
        run: |
          aws s3 cp s3://${{ secrets.TARGET_S3_BUCKET_NAME }}/projects/cyberpunk/pariah-nexus-api/initialization_data/initialize_database.sql ./initialize_database.sql

      - name: Build DB Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pariah-nexus-db:latest -f ./Database/Dockerfile .

      - name: Push API Docker image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/pariah-nexus-api:latest

      - name: Push DB Docker image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/pariah-nexus-db:latest

  check-terraform-changes:
    name: Check for Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      terraform_changed: ${{ steps.check.outputs.terraform_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 3  # Fetch the last three commits

      - name: Determine if Terraform files have changed
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Workflow manually triggered. Assuming changes in Terraform files."
            echo "terraform_changed=true" >> $GITHUB_ENV
          elif [ -z "${{ github.event.before }}" ]; then
            echo "No previous commit found. Assuming changes in Terraform files."
            echo "terraform_changed=true" >> $GITHUB_ENV
          else
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'terraform/.*'; then
              echo "terraform_changed=true" >> $GITHUB_ENV
            else
              echo "terraform_changed=false" >> $GITHUB_ENV
            fi
          fi

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required to exchange the GitHub token for AWS credentials
      contents: read   # Standard permission to read the repository
    needs: [build-deploy, check-terraform-changes]
    if: needs.check-terraform-changes.outputs.terraform_changed == 'true'
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PARIAH_NEXUS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # Step 2: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.1  # Adjust this to your Terraform version

      # Step 3: Initialize Terraform
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Step 4: Run Terraform Plan
      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      # Step 5: Upload the plan file as an artifact
      - name: Upload Plan File
        uses: actions/upload-artifact@v3
        with:
          name: terraform-plan
          path: ./terraform/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required to exchange the GitHub token for AWS credentials
      contents: read   # Standard permission to read the repository
    needs: [terraform-plan, check-terraform-changes]  # Only run this job if 'terraform-plan' completes successfully
    if: success()

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PARIAH_NEXUS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # Step 2: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.1 # Adjust this to your Terraform version

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Step 3: Download the plan artifact
      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: terraform-plan
          path: ./terraform

      # Step 4: Run Terraform Apply (auto-approved)
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
